<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10131f">
  <title>BJJ Schedule</title>
  <style>
    :root { color-scheme: dark; --bg:#10131f; --panel:#191e2d; --panel2:#202638; --line:#30384d; --ink:#f4f5f8; --muted:#a5aec2; --accent:#ff9d5c; --blue:#6ac8ff; --green:#91e6b0; --purple:#c7a5ff; }
    * { box-sizing:border-box }
    body { margin:0; background:radial-gradient(ellipse at 10% 0%,#25223b 0,transparent 42%),var(--bg); color:var(--ink); font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(1440px,100%); margin:auto; padding:42px 28px 64px; }
    .top { display:flex; justify-content:space-between; gap:24px; align-items:flex-start; margin-bottom:26px }
    .title-row { display:flex; align-items:center; gap:16px }
    h1 { margin:8px 0 6px; font-size:clamp(32px,5vw,54px); line-height:1.02; letter-spacing:-.045em }
    .brand-logos { display:flex; align-items:center; gap:8px }
    .brand-logo { width:46px; height:46px; object-fit:contain; border-radius:50%; background:#fff; padding:3px }
    .brand-logo.snake { background:#050505; padding:0; border:1px solid #493521 }
    .sub { margin:0; color:var(--muted); max-width:660px }
    .week-box { display:flex; align-items:center; gap:10px; padding:8px; border:1px solid var(--line); background:#191e2dcc; border-radius:16px; white-space:nowrap }
    button { color:var(--ink); font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--panel2); border-radius:10px; padding:10px 13px; }
    button:hover { border-color:#707d9d }
    .week-label { min-width:190px; text-align:center; font-size:13px; font-weight:700 }
    .week-type { display:block; margin-top:2px; font-size:11px; color:var(--accent); text-transform:uppercase; letter-spacing:.08em }
    .controls { display:flex; justify-content:space-between; align-items:center; gap:14px; margin:23px 0 14px; flex-wrap:wrap }
    .filters { display:flex; gap:8px; flex-wrap:wrap }
    .filter-stack { display:grid; gap:9px }
    .filter-label { width:74px; color:var(--muted); font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; align-self:center }
    .filter-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap }
    .filter { padding:8px 12px; border-radius:99px; color:var(--muted); background:transparent }
    .filter.active { color:var(--ink); border-color:#8490ad; background:#30384d }
    .legend { display:flex; gap:14px; flex-wrap:wrap; color:var(--muted); font-size:12px }
    .dot { display:inline-block; width:8px;height:8px;border-radius:50%;margin-right:6px }
    .grid { display:grid; grid-template-columns:repeat(7,minmax(155px,1fr)); gap:10px; overflow-x:auto; padding-bottom:10px; align-items:stretch }
    .day { min-height:220px; border:1px solid var(--line); background:#171c2abf; border-radius:15px; overflow:hidden }
    .day.today { border-color:#e89c6e; box-shadow:0 0 0 1px #e89c6e33 }
    .day-head { padding:12px 12px 10px; border-bottom:1px solid var(--line); background:#ffffff05; display:flex; justify-content:space-between; gap:5px; align-items:baseline }
    .day-head strong { font-size:13px }
    .day-head span { color:var(--muted); font-size:11px }
    .cards { padding:8px; display:grid; gap:8px }
    .class { border-left:3px solid var(--blue); background:var(--panel); padding:9px 9px 9px 10px; border-radius:8px; min-width:0 }
    .class.gi { border-color:var(--purple) }.class.nogi { border-color:var(--blue) }.class.open { border-color:var(--green) }.class.other { border-color:var(--accent) }
    .time { color:#c1c9d9; font-size:11px; font-weight:700; margin-bottom:3px }
    .name { font-size:12px; font-weight:750; line-height:1.3 }
    .meta { margin-top:5px; color:var(--muted); font-size:10px; line-height:1.3 }
    .academy { display:flex; align-items:center; gap:6px }
    .academy-logo { width:25px; height:25px; flex:0 0 25px; object-fit:contain; border-radius:50%; background:#fff; padding:2px }
    .academy-logo.snake { background:#050505; padding:0; border:1px solid #493521 }
    .empty { padding:14px 8px; color:#68738b; font-size:12px; text-align:center }
    .footer { color:var(--muted); font-size:12px; margin-top:19px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap }
    .footer strong { color:#d9deea }
    @media(max-width:1100px){ .grid{grid-template-columns:repeat(4,minmax(175px,1fr))} }
    @media(max-width:760px){ main{padding:28px 16px 45px}.top{display:block}.week-box{margin-top:18px;width:max-content;max-width:100%}.grid{grid-template-columns:repeat(2,minmax(155px,1fr))} }
    @media(max-width:420px){ .grid{grid-template-columns:1fr 1fr;gap:7px}.day{min-height:160px}.day-head{padding:10px 8px}.cards{padding:6px}.class{padding:8px}.week-label{min-width:150px} }
    html { -webkit-text-size-adjust:100%; text-size-adjust:100% }
    button { min-height:44px; min-width:44px; touch-action:manipulation }
    button:focus-visible { outline:2px solid var(--accent); outline-offset:3px }
    .calendar-tools { display:grid; gap:10px; flex-shrink:0 }
    .view-controls { display:flex; justify-content:space-between; gap:12px }
    .view-switch { display:flex; gap:4px; padding:3px; border:1px solid var(--line); border-radius:13px }
    .view-switch button { border-color:transparent; background:transparent; color:var(--muted) }
    .view-switch button[aria-pressed="true"] { background:var(--panel2); color:var(--ink); border-color:#8490ad }
    .grid.day-view { grid-template-columns:minmax(0,1fr); max-width:760px; margin-inline:auto; overflow:visible }
    .day-view .day-head { padding:16px }
    .day-view .day-head strong { font-size:18px }
    .day-view .day-head span { font-size:14px }
    .day-view .cards { padding:12px; gap:12px }
    .day-view .class { padding:14px }
    .day-view .time { font-size:14px }
    .day-view .name { font-size:17px }
    .day-view .meta { font-size:13px; margin-top:9px }
    .day-view .empty { padding:32px 12px; font-size:15px }
    @media(max-width:760px){
      main { padding-left:max(16px,env(safe-area-inset-left)); padding-right:max(16px,env(safe-area-inset-right)); padding-bottom:max(45px,env(safe-area-inset-bottom)) }
      .calendar-tools { margin-top:20px; width:100%; min-width:0 }
      .week-box { margin:0; width:100%; white-space:normal }
      .week-label { min-width:0; flex:1 }
      .title-row { gap:10px; flex-wrap:wrap }
      .brand-logos { flex-shrink:0 }
      .filter-label { width:100% }
      .grid { grid-template-columns:repeat(2,minmax(0,1fr)) }
    }
  </style>
</head>
<body>
<main>
  <header class="top">
    <div>
      <div class="title-row">
        <h1>BJJ Schedule</h1>
        <div class="brand-logos" aria-label="Evolution Grappling Academy and Snake Hill MMA">
          <img id="evolutionHeaderLogo" class="brand-logo" alt="Evolution Grappling Academy logo">
          <img id="snakeHeaderLogo" class="brand-logo snake" alt="Snake Hill MMA logo">
        </div>
      </div>
      <p class="sub">Adult classes and open mats, by day or week. Gi and No-Gi fundamentals rotate automatically with the date.</p>
    </div>
    <div class="calendar-tools">
      <div class="view-controls">
        <div class="view-switch" role="group" aria-label="Calendar view">
          <button data-view="day" aria-pressed="false">Day</button>
          <button data-view="week" aria-pressed="true">Week</button>
        </div>
        <button id="today">Today</button>
      </div>
      <div class="week-box" role="group" aria-label="Navigate calendar">
      <button id="prev" aria-label="Previous week">←</button>
      <div class="week-label" id="weekLabel" aria-live="polite" aria-atomic="true"></div>
      <button id="next" aria-label="Next week">→</button>
      </div>
    </div>
  </header>

  <div class="controls">
    <div class="filter-stack">
      <div class="filter-row" role="group" aria-label="Filter by location">
        <span class="filter-label">Location</span>
        <button class="filter active" data-group="location" data-value="all">All locations</button>
        <button class="filter" data-group="location" data-value="beacon">Evolution · Beacon</button>
        <button class="filter" data-group="location" data-value="fishkill">Evolution · Fishkill</button>
        <button class="filter" data-group="location" data-value="snake">Snake Hill · Marlboro</button>
      </div>
      <div class="filter-row" role="group" aria-label="Filter by Gi or No-Gi">
        <span class="filter-label">Class type</span>
        <button class="filter active" data-group="type" data-value="all">All classes</button>
        <button class="filter" data-group="type" data-value="gi">Gi</button>
        <button class="filter" data-group="type" data-value="nogi">No-Gi</button>
      </div>
    </div>
    <div class="legend"><span><i class="dot" style="background:var(--purple)"></i>Gi</span><span><i class="dot" style="background:var(--blue)"></i>No-Gi</span><span><i class="dot" style="background:var(--green)"></i>Open mat</span><span><i class="dot" style="background:var(--accent)"></i>Other</span></div>
  </div>

  <section class="grid" id="schedule" aria-label="Weekly class schedule"></section>
  <footer class="footer"><span><strong>Evolution Grappling Academy:</strong> Beacon + Fishkill</span><span><strong>Snake Hill MMA:</strong> Marlboro</span><span>Adult schedule · times are local</span></footer>
</main>

  const fmt = new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric'});
  function startOfWeek(date){ const d=new Date(date.getFullYear(),date.getMonth(),date.getDate()); const offset=(d.getDay()+6)%7; d.setDate(d.getDate()-offset); return d; }
  function dateOffsetWeeks(date){ const week=startOfWeek(date); return Math.round((Date.UTC(week.getFullYear(),week.getMonth(),week.getDate())-Date.UTC(anchorMonday.getFullYear(),anchorMonday.getMonth(),anchorMonday.getDate()))/(7*86400000)); }
  function rotationKey(date){ return ((dateOffsetWeeks(date)%2)+2)%2===0?'B':'A'; }
  function shiftDate(date,days){const d=new Date(date);d.setDate(d.getDate()+days);return d;}
  function classType(kind,key){ if(!kind.startsWith('rot-')) return kind; const day=kind.slice(4); return rotation[key][day].toLowerCase()==='gi'?'gi':'nogi'; }
  function render(){
    const monday=startOfWeek(selectedDate), key=rotationKey(selectedDate), weekEnd=shiftDate(monday,6);
    const label=view==='day'
      ? selectedDate.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'})
      : `${fmt.format(monday)} – ${fmt.format(weekEnd)}, ${weekEnd.getFullYear()}`;
    document.getElementById('weekLabel').innerHTML=`${label}<span class="week-type">Rotation ${key}</span>`;
    document.getElementById('prev').setAttribute('aria-label',`Previous ${view}`);
    document.getElementById('next').setAttribute('aria-label',`Next ${view}`);
    document.querySelectorAll('[data-view]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.view===view)));
    document.querySelectorAll('.filter').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.value===(button.dataset.group==='location'?locationFilter:typeFilter))));
    const target=document.getElementById('schedule'); target.innerHTML='';
    target.className='grid'+(view==='day'?' day-view':'');
    target.setAttribute('aria-label',`${view==='day'?'Daily':'Weekly'} class schedule`);
    days.forEach((day,index)=>{
      if(view==='day'&&index!==(selectedDate.getDay()+6)%7) return;
      const date=shiftDate(monday,index); const dayEl=document.createElement('article');
      dayEl.className='day'+(date.toDateString()===new Date().toDateString()?' today':'');
      const items=sessions.filter(s=>{
        if(s.day!==index||(locationFilter!=='all'&&s.loc!==locationFilter)) return false;
        const type=classType(s.kind,key);
        return typeFilter==='all'||type===typeFilter;
      }).sort((a,b)=>toMinutes(a.start)-toMinutes(b.start));
      dayEl.innerHTML=`<div class="day-head"><strong>${day}</strong><span>${fmt.format(date)}</span></div>`;
      const list=document.createElement('div'); list.className='cards';
      if(!items.length) list.innerHTML='<div class="empty">No listed classes</div>';
      items.forEach(s=>{
        const type=classType(s.kind,key); const name=s.kind.startsWith('rot-')?`Fundamentals · ${rotation[key][s.kind.slice(4)]}`:s.name;
        const card=document.createElement('div'); card.className=`class ${type}`;
        const academy=s.loc==='snake'?'Snake Hill · Marlboro':`Evolution · ${s.site}`;
        const academyLabel=s.loc==='snake'?academy:`Evolution · <strong>${s.site}</strong>`;
        const logoClass=s.loc==='snake'?'academy-logo snake':'academy-logo';
        card.innerHTML=`<div class="time">${s.start}–${s.end}</div><div class="name">${name}</div><div class="meta academy"><img class="${logoClass}" src="${logos[s.loc==='snake'?'snake':'beacon']}" alt="${academy} logo"><span>${academyLabel}${s.kind.startsWith('rot-')?' · rotating':''}</span></div>`;
        list.appendChild(card);
      });
      dayEl.appendChild(list); target.appendChild(dayEl);
    });
  }
  function toMinutes(t){const [clock,period]=t.split(' ');let [h,m]=clock.split(':').map(Number); if(period==='PM'&&h!==12)h+=12;if(period==='AM'&&h===12)h=0;return h*60+m;}
  document.getElementById('prev').addEventListener('click',()=>{selectedDate=shiftDate(selectedDate,view==='day'?-1:-7);render()});
  document.getElementById('next').addEventListener('click',()=>{selectedDate=shiftDate(selectedDate,view==='day'?1:7);render()});
  document.getElementById('today').addEventListener('click',()=>{selectedDate=new Date();render()});
  document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{view=button.dataset.view;render() }));
  document.querySelectorAll('.filter').forEach(button=>button.addEventListener('click',()=>{
    const group=button.dataset.group;
    document.querySelectorAll(`.filter[data-group="${group}"]`).forEach(b=>b.classList.remove('active'));
    button.classList.add('active');
    if(group==='location') locationFilter=button.dataset.value;
    if(group==='type') typeFilter=button.dataset.value;
    render();
  }));
  render();
</script>
</body>
</html>
