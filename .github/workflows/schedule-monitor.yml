name: Check schedule images

on:
  schedule:
    - cron: '17 13 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: schedule-image-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: monitor/requirements.txt
      - run: python -m pip install -r monitor/requirements.txt
      - name: Test image comparison and failure handling
        run: python -m unittest discover -s tests -v
      - name: Check all three schedules
        run: python scripts/check_schedules.py
      - name: Save before, after, and difference images
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schedule-comparison
          path: monitor-output/
          retention-days: 90
          if-no-files-found: error
      - name: Report changes or download failures
        if: always()
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- bjj-schedule-monitor -->';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const report = fs.existsSync('monitor-output/report.json')
              ? JSON.parse(fs.readFileSync('monitor-output/report.json', 'utf8'))
              : {needs_review: true, results: [{name: 'Monitor', status: 'error', error: 'No report produced; inspect the workflow logs.'}]};
            const lines = report.results.map(r => `- **${r.name}**: ${r.status}${r.url ? ` ([checked image](${r.url}))` : ''}${r.error ? ` — ${r.error}` : ''}`);
            await core.summary.addHeading('Schedule image check').addRaw(lines.join('\n')).write();
            if (!report.needs_review) return;
            const body = [marker, 'Schedule images need review', '', ...lines, '',
              `[Workflow run](${run})`, `[Download before/after/diff evidence](${process.env.ARTIFACT_URL || run})`, '',
              'Review adult class information only: days, start/end times, class names, Gi/No-Gi, additions and cancellations. Locations are fixed and are not part of the comparison. Kids classes remain excluded.', '',
              'A mismatch means the website differs from the accepted schedule; the website may be older. Never replace a newer user-confirmed schedule with stale website information. A changed picture is not proof of changed classes. Read the images, propose any calendar edits for review, and update the accepted baseline in the same reviewed commit. Do not change the calendar automatically. For a cosmetic-only change, update only the baseline. For a download error, repair the source and rerun; do not accept it as unchanged.', '',
              'See monitor/README.md for baseline acceptance instructions. Evidence expires after 90 days; rerun if needed.'
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state: 'open', creator: 'github-actions[bot]', per_page: 100});
            const existing = issues.find(i => !i.pull_request && i.body?.includes(marker));
            if (existing) {
              await github.rest.issues.update({...context.repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({...context.repo, title: 'Review schedule image changes or monitoring errors', body});
            }
            core.setFailed('Schedule review required; see the monitor issue and evidence artifact.');
